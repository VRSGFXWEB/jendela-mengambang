(function(){
var txt=document.getElementById('txt'),fin=false;
function finish(){if(fin)return;fin=true;try{if(window.Android&&Android.done)Android.done();}catch(e){}}
function fallback(){
  document.getElementById('c').style.display='none';
  var im=new Image();im.src=LOGO;im.id='fb';document.body.appendChild(im);
  setTimeout(function(){txt.className='in'},700);setTimeout(finish,2700);
}
if(typeof THREE==='undefined'){fallback();return;}
try{
  var canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x05080d,1);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  function resize(){
    var w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h);camera.aspect=w/h;
    camera.position.z=Math.max(6,5.6/camera.aspect);
    camera.updateProjectionMatrix();
  }
  resize();window.addEventListener('resize',resize);

  var tex=new THREE.TextureLoader().load(LOGO);
  var logo=new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4),
    new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  var r1=new THREE.Mesh(new THREE.TorusGeometry(1.95,0.025,16,120),
    new THREE.MeshBasicMaterial({color:0x8fb8ff,transparent:true,opacity:0}));
  var r2=new THREE.Mesh(new THREE.TorusGeometry(2.25,0.02,16,120),
    new THREE.MeshBasicMaterial({color:0x3d8bff,transparent:true,opacity:0}));
  r1.rotation.x=1.15;r2.rotation.x=1.15;r2.rotation.y=0.55;
  var g=new THREE.Group();g.add(logo);g.add(r1);g.add(r2);scene.add(g);

  var n=240,arr=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var rad=3+Math.random()*7,th=Math.random()*6.2832,ph=Math.acos(2*Math.random()-1);
    arr[i*3]=rad*Math.sin(ph)*Math.cos(th);arr[i*3+1]=rad*Math.sin(ph)*Math.sin(th);arr[i*3+2]=rad*Math.cos(ph)-3;
  }
  var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(arr,3));
  var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8fb8ff,size:0.06,transparent:true,opacity:0.8}));
  scene.add(pts);

  var clock=new THREE.Clock(),shown=false;
  function ease(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
  function loop(){
    var t=clock.getElapsedTime();
    var k=Math.min(t/1.1,1);
    g.scale.setScalar(Math.max(ease(k),0.0001));
    logo.rotation.y=(1-k)*(-4.7)+k*Math.sin(Math.max(t-1.1,0)*1.4)*0.28;
    g.position.y=Math.sin(t*1.6)*0.08;
    var o=Math.min(Math.max((t-0.5)/0.6,0),1);
    r1.material.opacity=o*0.9;r2.material.opacity=o*0.8;
    r1.rotation.z+=0.012;r2.rotation.z-=0.009;
    pts.rotation.y=t*0.05;pts.rotation.x=t*0.02;
    if(!shown&&t>0.9){shown=true;txt.className='in';}
    renderer.render(scene,camera);
    if(t>2.9)finish();
    requestAnimationFrame(loop);
  }
  loop();
}catch(e){fallback();}
})();
</script></body></html>
